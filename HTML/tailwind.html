<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-red-200 min-h-screen flex items-center justify-center">

<form action="#" method="post"
      class="bg-white w-full max-w-lg p-8 rounded-xl shadow-lg space-y-5">

    <h1 class="text-3xl font-bold text-center text-blue-700">
        Student Registration Form
    </h1>

    <!-- Name -->
    <div>
        <label for="name" class="block font-semibold mb-1">Full Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name"
               class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
               required>
    </div>

    <!-- Email -->
    <div>
        <label for="email" class="block font-semibold mb-1">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email"
               class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
               required>
    </div>

    <!-- Password -->
    <div>
        <label for="password" class="block font-semibold mb-1">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter password"
               class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
               required>
    </div>

    <!-- Phone -->
    <div>
        <label for="phone" class="block font-semibold mb-1">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="9876543210"
               class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Age -->
    <div>
        <label for="age" class="block font-semibold mb-1">Age</label>
        <input type="number" id="age" name="age" min="18" max="60"
               class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Date -->
    <div>
        <label for="dob" class="block font-semibold mb-1">Date of Birth</label>
        <input type="date" id="dob" name="dob"
               class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Gender -->
    <div>
        <label class="block font-semibold mb-2">Gender</label>
        <div class="flex gap-6">
            <label><input type="radio" name="gender" value="Male" class="mr-2">Male</label>
            <label><input type="radio" name="gender" value="Female" class="mr-2">Female</label>
            <label><input type="radio" name="gender" value="Other" class="mr-2">Other</label>
        </div>
    </div>

    <!-- Hobbies -->
    <div>
        <label class="block font-semibold mb-2">Hobbies</label>
        <div class="flex gap-6">
            <label><input type="checkbox" value="Reading" class="mr-2">Reading</label>
            <label><input type="checkbox" value="Sports" class="mr-2">Sports</label>
            <label><input type="checkbox" value="Music" class="mr-2">Music</label>
        </div>
    </div>

    <!-- Country -->
    <div>
        <label for="country" class="block font-semibold mb-1">Country</label>
        <select id="country"
                class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option>Select Country</option>
            <option>India</option>
            <option>USA</option>
            <option>Canada</option>
            <option>Australia</option>
            <option>Japan</option>
        </select>
    </div>

    <!-- Address -->
    <div>
        <label for="address" class="block font-semibold mb-1">Address</label>
        <textarea id="address" rows="4"
                  placeholder="Enter your address"
                  class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
    </div>

    <!-- Resume -->
    <div>
        <label for="file" class="block font-semibold mb-1">Upload Resume</label>
        <input type="file" id="file"
               class="w-full border border-gray-300 rounded-md p-2">
    </div>

    <!-- Favorite Color -->
    <div>
        <label for="color" class="block font-semibold mb-1">Favorite Color</label>
        <input type="color" id="color" class="w-20 h-10">
    </div>

    <!-- Skill -->
    <div>
        <label for="range" class="block font-semibold mb-1">Skill Level</label>
        <input type="range" id="range" min="0" max="100" class="w-full">
    </div>

    <!-- Buttons -->
    <div class="flex justify-between">
        <input type="submit" value="Register"
               class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg cursor-pointer">

        <input type="reset" value="Clear"
               class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg cursor-pointer">
    </div>

</form>
</body>
</html>
